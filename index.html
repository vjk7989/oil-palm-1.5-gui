  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" onload="window.dispatchEvent(new Event('leafletready'))"></script>
  <style>

    .btn,.btn-ghost{border-radius:9px;font-weight:600}

    function renderSettings(){
      const user=effectiveManagedUser(currentManagedUser()||{roleId:state.role,scope:"ap-all",name:roles[state.role].name,email:"demo@palmwatch.local"}),prefs=getPreferences();
      content.innerHTML=`<div class="pagehead"><div><h1 class="h1">Settings</h1><p class="sub">Account context and browser-local preferences for the PalmWatch AP demonstration.</p></div></div><p class="statusline" role="status" aria-live="polite">${escapeHtml(state.statusMessage)}</p><div class="settings-grid"><div class="admin-stack"><section class="card"><h2 class="cardt">Account and assignment</h2><dl class="detail-list"><div class="detail-pair"><dt>Name</dt><dd>${escapeHtml(user.name)}</dd></div><div class="detail-pair"><dt>Email</dt><dd>${escapeHtml(user.email)}</dd></div><div class="detail-pair"><dt>Role</dt><dd>${escapeHtml(roles[state.role].name)}</dd></div><div class="detail-pair"><dt>AP scope</dt><dd>${escapeHtml(scopeLabel(user))}</dd></div></dl></section><section class="card"><h2 class="cardt">Notifications</h2><label class="choice"><input type="checkbox" id="notificationPreference" ${prefs.notifications?"checked":""}><span><b>Operational notifications</b><span>Show browser-demo notices for assigned alerts, cases, and treatment activity.</span></span></label></section><section class="card"><h2 class="cardt">Display density</h2><div class="choice-group" role="radiogroup" aria-label="Display density"><label class="choice"><input type="radio" name="density" value="comfortable" ${prefs.density==="comfortable"?"checked":""}><span><b>Comfortable</b><span>More breathing room between records.</span></span></label><label class="choice"><input type="radio" name="density" value="compact" ${prefs.density==="compact"?"checked":""}><span><b>Compact</b><span>Fit more operational rows on screen.</span></span></label></div></section></div><aside class="card danger-zone"><h2 class="cardt">Reset browser demo</h2><p class="sub">Clear read-alert markers, case and treatment actions, administration changes, report history, and preferences. The deterministic AP farm dataset remains unchanged.</p>${state.resetConfirm?`<div class="notice" style="margin-top:14px"><strong>Reset all       document.getElementById("notificationPreference").addEventListener("change",event=>{updatePreference("notifications",event.target.checked);render()});

    function renderPlaceholder(){
      const farms=flatFarms(scopedDistricts()), m=metricsFor(farms);
      content.innerHTML = `<div class="pagehead"><div><h1 class="h1">${state.page}</h1><p class="sub">Functional AP-only ${state.page.toLowerCase()} workspace. Data respects the selected role scope and excludes non-AP regions.</p></div></div>${metricStrip(m)}<div class="panel"><div class="paneltitle">${state.page} records<span class="lvl">role scoped</span></div>${farms.slice(0,8).map(f=>`<button class="htr frow" data-farm="${f.id}"><span class="hname"><span class="nm">${f.name}</span><span class="lvl">${f.district}</span></span><span class="num">${fmt(f.trees)}</span><span class="num">${fmt(f.infected)}</span><span class="num">${fmt(f.pending)}</span><span><em class="badge ${hclass(f.risk)}">${hlabel(f.risk)}</em></span></button>`).join("")}</div>`;
      content.querySelectorAll("[data-farm]").forEach(b=>b.addEventListener("click",()=>{state.page="Overview";state.farmId=b.dataset.farm;render()}));
    }
    function invalidateNewFarmPreview(){state.newFarmPreview=null;state.newFarmErrors=[];}
    function renderNewFarm(){
      if(!["admin","ceo"].includes(state.role)){state.page="Overview";state.statusMessage="New Farm is limited to System Administrator and CEO / General Manager.";return render();}
      state.newFarmDraft=normalizeNewFarmDraft(state.newFarmDraft);
      state.newFarmAcre=Math.max(1,Math.min(state.newFarmDraft.acres,Number(state.newFarmAcre)||1));
      const draft=state.newFarmDraft,current=draft.layouts[state.newFarmAcre-1],validation=validateNewFarmDraft(draft),selected=current.cells.filter(cell=>cell.occupied).length,totalSelected=draft.layouts.reduce((sum,layout)=>sum+layout.cells.filter(cell=>cell.occupied).length,0),targetTotal=draft.layouts.reduce((sum,layout)=>sum+layout.target,0),difference=current.target-selected;
      const canonicalDistrict=districts.find(item=>item.name===draft.district)||districts[0],mandals=canonicalDistrict.mandals,canonicalMandal=mandals.find(item=>item.name===draft.mandal)||mandals[0],villages=canonicalMandal.villages;
      const userOptions=roleId=>managedUsers.filter(user=>user.roleId===roleId&&effectiveManagedUser(user).active).map(user=>`<option value="${user.id}" ${draft[roleId==="head"?"headUserId":roleId==="manager"?"managerUserId":"staffUserId"]===user.id?"selected":""}>${escapeHtml(user.name)} · ${escapeHtml(scopeLabel(effectiveManagedUser(user)))}</option>`).join("");
      content.innerHTML=`<div class="pagehead"><div><h1 class="h1">Add a new AP farm</h1><p class="sub">Set the exact 8×8 layout for every acre and review generated display-only IDs before any future save workflow is introduced.</p></div><em class="badge h-neutral">Preview-only builder</em></div><div class="notice" style="margin-bottom:18px"><strong>Preview only — not saved.</strong> Preview validates and freezes the exact layout for review. It does not create farms, trees, browser-storage records, cases, treatments, survey readings, or diagnoses.</div>
      <div class="farm-builder"><div class="farm-builder-stack"><form class="card" id="newFarmForm"><h3 class="cardt">Farm identity and AP geography</h3><div class="formgrid"><div class="field"><label for="farmName">Farm name</label><input required id="farmName" name="name" value="${escapeHtml(draft.name)}" placeholder="e.g. Munduru South Block"></div><div class="field"><label for="farmDistrict">District</label><select id="farmDistrict" name="district">${districts.map(item=>`<option ${draft.district===item.name?"selected":""}>${item.name}</option>`).join("")}</select></div><div class="field"><label for="farmMandal">Mandal</label><select id="farmMandal" name="mandal">${mandals.map(item=>`<option ${draft.mandal===item.name?"selected":""}>${item.name}</option>`).join("")}</select></div><div class="field"><label for="farmVillage">Village</label><select id="farmVillage" name="village">${villages.map(item=>`<option ${draft.village===item.name?"selected":""}>${item.name}</option>`).join("")}</select></div><div class="field"><label for="farmLat">Latitude</label><input required id="farmLat" name="lat" type="number" min="12.55" max="19.25" step="0.0001" value="${Number.isFinite(draft.lat)?draft.lat:""}"><span class="field-help">Approximate AP demo location; not an ownership boundary.</span></div><div class="field"><label for="farmLon">Longitude</label><input required id="farmLon" name="lon" type="number" min="76.70" max="84.85" step="0.0001" value="${Number.isFinite(draft.lon)?draft.lon:""}"></div><div class="field"><label for="farmAcres">Number of acres</label><input required id="farmAcres" name="acres" type="number" min="1" max="24" value="${draft.acres}"><span class="field-help">One exact 8×8 grid is created per acre.</span></div></div><h3 class="cardt" style="margin-top:20px">Assignments</h3><div class="formgrid"><div class="field"><label for="farmHead">Plantation Head</label><select id="farmHead" name="headUserId">${userOptions("head")}</select></div><div class="field"><label for="farmManager">Area Manager</label><select id="farmManager" name="managerUserId">${userOptions("manager")}</select></div><div class="field"><label for="farmStaff">Field Staff</label><select id="farmStaff" name="staffUserId">${userOptions("staff")}</select></div></div></form></div>
      <div class="farm-builder-stack"><section class="card" aria-labelledby="layoutTitle"><div class="acre-toolbar"><div><h3 class="cardt" id="layoutTitle" style="margin:0">Set the farm grid layout</h3><p class="sub">Acre ${state.newFarmAcre} of ${draft.acres}</p></div><div class="acre-nav"><button class="btn-ghost" id="newFarmPrev" ${state.newFarmAcre===1?"disabled":""}>Previous</button><button class="btn-ghost" id="newFarmNext" ${state.newFarmAcre===draft.acres?"disabled":""}>Next</button></div></div><div class="acre-pills" aria-label="Choose acre">${draft.layouts.map(layout=>`<button class="acre-pill" data-new-acre="${layout.acre}" aria-current="${layout.acre===state.newFarmAcre}">Acre ${layout.acre} · ${layout.cells.filter(cell=>cell.occupied).length}/${layout.target}</button>`).join("")}</div><div class="field" style="margin-top:14px;max-width:260px"><label for="acreTarget">Number of trees on acre ${state.newFarmAcre}</label><input id="acreTarget" type="number" min="50" max="57" value="${current.target}"></div><div class="grid-counter" aria-live="polite"><span class="count-chip"><strong>${selected}/${current.target}</strong> plotted</span><span class="count-chip"><strong>${difference>0?difference:0}</strong> remaining</span>${difference<0?`<span class="count-chip"><strong>${Math.abs(difference)}</strong> over target</span>`:""}<span class="count-chip"><strong>${totalSelected}/${targetTotal}</strong> farm total</span></div><div class="treegrid" id="newFarmGrid" role="grid" aria-label="Editable acre ${state.newFarmAcre} layout">${current.cells.map((cell,index)=>`<button type="button" class="tcell is-editable ${cell.occupied?"h-ok":"h-empty"}" data-layout-cell="${index}" aria-pressed="${cell.occupied}" aria-label="Acre ${state.newFarmAcre}, row ${cell.row}, column ${cell.column}: ${cell.occupied?"Tree plotted":"No tree"}">${cell.occupied?current.cells.slice(0,index+1).filter(item=>item.occupied).length:""}</button>`).join("")}</div><p class="sub">Black means no tree. Black cells are editable here and disabled after saving.</p><div class="builder-actions"><button class="btn-ghost" id="resetAcre">Reset this acre</button><button class="btn-ghost" id="copyPattern">Copy this pattern to all acres</button><button class="btn-ghost" id="resetAllAcres">Reset all acres</button></div><p class="form-error" id="newFarmErrors" role="alert">${state.newFarmErrors.map(escapeHtml).join(" ")}</p><div class="builder-actions"><button class="btn" id="previewNewFarm" ${validation.valid?"":"disabled"}>Preview farm layout</button></div><p class="save-note">Preview becomes available when every acre matches its independent 50–57 tree target and the AP farm fields are complete.</p></section><div id="newFarmPreview">${renderNewFarmPreview()}</div></div></div>`;
      bindNewFarmBuilder();
    }
    function renderNewFarmPreview(){
      const preview=state.newFarmPreview;
      if(!preview)return `<section class="card"><h3 class="cardt">Farm preview</h3><div class="empty-state"><strong>No exact preview yet</strong><span>Complete every acre grid, then choose Preview exact farm. Nothing has been saved.</span></div></section>`;
      const layout=preview.layouts.find(item=>item.acre===preview.previewAcre)||preview.layouts[0],selected=layout.cells.filter(cell=>cell.occupied).length;
      return `<section class="card" aria-labelledby="previewTitle"><div class="preview-banner"><div><b id="previewTitle">Exact preview ready · not saved</b><span>Review the Farm ID, assignments, acreage, and every occupied position. These IDs are display-only.</span></div><em class="badge h-neutral">Pending / no evidence</em></div><div class="preview-meta">${[["Farm ID",preview.id],["Farm",preview.draft.name],["Location",`${preview.draft.village}, ${preview.draft.mandal}, ${preview.draft.district}`],["Area",`${preview.draft.acres} ${preview.draft.acres===1?"acre":"acres"}`],["Plotted palms",preview.totalSelected],["Current acre",`${layout.acre} · ${selected}/${layout.target} plotted`]].map(item=>`<div class="tdrow"><span class="tdk">${item[0]}</span><span class="tdv">${escapeHtml(String(item[1]))}</span></div>`).join("")}</div><div class="acre-toolbar"><h3 class="cardt" style="margin:0">Preview acre ${layout.acre} of ${preview.draft.acres}</h3><div class="acre-nav"><button class="btn-ghost" id="previewPrevAcre" ${layout.acre===1?"disabled":""}>Previous</button><select class="csel" id="previewAcreSelect" aria-label="Preview acre">${preview.layouts.map(item=>`<option value="${item.acre}" ${item.acre===layout.acre?"selected":""}>Acre ${item.acre}</option>`).join("")}</select><button class="btn-ghost" id="previewNextAcre" ${layout.acre===preview.draft.acres?"disabled":""}>Next</button></div></div><div class="treegrid" role="grid" aria-label="Read-only preview acre ${layout.acre}">${layout.cells.map((cell,index)=>`<button class="tcell ${cell.occupied?"h-neutral":"h-empty"}" ${cell.occupied?`title="${cell.treeId}" aria-label="${cell.treeId}, row ${cell.row}, column ${cell.column}, Pending, no evidence"`:`disabled title="No tree" aria-label="Acre ${layout.acre}, row ${cell.row}, column ${cell.column}: No tree"`}>${cell.occupied?layout.cells.slice(0,index+1).filter(item=>item.occupied).length:""}</button>`).join("")}</div><div class="preview-actions"><button class="btn-ghost" id="editNewFarmGrid">Edit layout</button></div><p class="save-note"><strong>Preview only:</strong> this panel does not call persistence, does not add mock records, and does not write farms, trees, audit, notifications, cases, treatments, or browser-storage records.</p></section>`;
    }
    function bindNewFarmBuilder(){
      const form=document.getElementById("newFarmForm"),draft=state.newFarmDraft,current=draft.layouts[state.newFarmAcre-1];
      const updateField=(name,value)=>{draft[name]=value;invalidateNewFarmPreview();};
      form.querySelectorAll("input,select").forEach(control=>control.addEventListener("change",()=>{
        if(control.name==="acres"){
          const nextAcres=Math.max(1,Math.min(24,Math.trunc(Number(control.value)||1))),previous=draft.layouts;
          draft.acres=nextAcres;draft.layouts=Array.from({length:nextAcres},(_,index)=>previous[index]||createDefaultAcreLayout(index+1,54));state.newFarmAcre=Math.min(state.newFarmAcre,nextAcres);invalidateNewFarmPreview();return render();
        }
        if(control.name==="district"){
          const district=districts.find(item=>item.name===control.value)||districts[0],mandal=district.mandals[0],village=mandal.villages[0];
          Object.assign(draft,{district:district.name,mandal:mandal.name,village:village.name,lat:village.lat,lon:village.lon});invalidateNewFarmPreview();return render();
        }
        if(control.name==="mandal"){
          const district=districts.find(item=>item.name===draft.district),mandal=district.mandals.find(item=>item.name===control.value)||district.mandals[0],village=mandal.villages[0];
          Object.assign(draft,{mandal:mandal.name,village:village.name,lat:village.lat,lon:village.lon});invalidateNewFarmPreview();return render();
        }
        if(control.name==="village"){
          const village=districts.find(item=>item.name===draft.district)?.mandals.find(item=>item.name===draft.mandal)?.villages.find(item=>item.name===control.value);updateField("village",control.value);if(village){draft.lat=village.lat;draft.lon=village.lon;}return render();
        }
        updateField(control.name,["lat","lon"].includes(control.name)?Number(control.value):control.value);render();
      }));
      document.getElementById("acreTarget").addEventListener("change",event=>{current.target=Math.max(50,Math.min(57,Math.trunc(Number(event.target.value)||54)));invalidateNewFarmPreview();render()});
      document.querySelectorAll("[data-layout-cell]").forEach(button=>button.addEventListener("click",()=>{const cell=current.cells[Number(button.dataset.layoutCell)];cell.occupied=!cell.occupied;delete cell.treeId;invalidateNewFarmPreview();render()}));
      document.querySelectorAll("[data-new-acre]").forEach(button=>button.addEventListener("click",()=>{state.newFarmAcre=Number(button.dataset.newAcre);render()}));
      document.getElementById("newFarmPrev").addEventListener("click",()=>{state.newFarmAcre--;render()});document.getElementById("newFarmNext").addEventListener("click",()=>{state.newFarmAcre++;render()});
      document.getElementById("resetAcre").addEventListener("click",()=>{draft.layouts[state.newFarmAcre-1]=createDefaultAcreLayout(state.newFarmAcre,current.target);invalidateNewFarmPreview();render()});
      document.getElementById("resetAllAcres").addEventListener("click",()=>{draft.layouts=Array.from({length:draft.acres},(_,index)=>createDefaultAcreLayout(index+1,draft.layouts[index]?.target||54));invalidateNewFarmPreview();render()});
      document.getElementById("copyPattern").addEventListener("click",()=>{draft.layouts=Array.from({length:draft.acres},(_,index)=>({acre:index+1,target:current.target,cells:current.cells.map(cell=>({acre:index+1,row:cell.row,column:cell.column,occupied:cell.occupied}))}));invalidateNewFarmPreview();render()});
      document.getElementById("previewNewFarm").addEventListener("click",()=>{const result=validateNewFarmDraft(draft);if(!result.valid){state.newFarmErrors=result.errors;state.newFarmPreview=null;return render();}const id=generatePreviewFarmId(result.draft),layouts=generatePreviewTreeIds(id,result.draft.layouts);state.newFarmPreview={id,draft:result.draft,layouts,totalSelected:result.totalSelected,previewAcre:1};state.newFarmErrors=[];render()});
      const preview=state.newFarmPreview;if(!preview)return;
      document.getElementById("previewPrevAcre").addEventListener("click",()=>{preview.previewAcre--;render()});document.getElementById("previewNextAcre").addEventListener("click",()=>{preview.previewAcre++;render()});document.getElementById("previewAcreSelect").addEventListener("change",event=>{preview.previewAcre=Number(event.target.value);render()});
      document.getElementById("editNewFarmGrid").addEventListener("click",()=>{document.getElementById("layoutTitle").scrollIntoView({behavior:"smooth",block:"start"});document.getElementById("acreTarget").focus()});
    }
    function renderNewFarmLegacy(){
      content.innerHTML = `<div class="pagehead"><div><h1 class="h1">New Farm Preview</h1><p class="sub">Preview-only farm layout builder. Nothing is saved to mock data, browser storage, audit, notifications, or trees.</p></div></div><div class="grid2"><form class="card" id="newFarmForm"><h3 class="cardt">Farm identity and AP geography</h3><div class="formgrid"><div class="field"><label>Farm name</label><input required name="name" value="Preview Pedavegi Farm"></div><div class="field"><label>District</label><select name="district"><option>Eluru</option><option>East Godavari</option><option>West Godavari</option><option>Krishna</option></select></div><div class="field"><label>Mandal</label><input required name="mandal" value="Pedavegi"></div><div class="field"><label>Village</label><input required name="village" value="Munduru"></div><div class="field"><label>Latitude</label><input required name="lat" value="16.8792"></div><div class="field"><label>Longitude</label><input required name="lon" value="81.1471"></div><div class="field"><label>Number of acres</label><input required type="number" name="acres" min="1" max="24" value="1"></div><div class="field"><label>Trees on current acre</label><input required type="number" name="density" min="50" max="57" value="54"></div></div><p class="sub" id="plotCount">54/54 plotted on acre 1</p><div class="treegrid" id="editGrid">${Array.from({length:64},(_,i)=>`<button type="button" class="tcell ${i<54?"h-ok":"h-empty"}" data-i="${i}">${i<54?i+1:""}</button>`).join("")}</div><p class="sub">Black cells are editable here. In Farm Detail, black means no tree and is disabled.</p><button class="btn" style="margin-top:16px">Add farm</button></form><div id="previewPane" class="card"><h3 class="cardt">Preview only - not saved yet</h3><p class="sub">Press Add farm to render the unsaved farm layout preview.</p></div></div>`;
      const grid=document.getElementById("editGrid"), form=document.getElementById("newFarmForm"), count=document.getElementById("plotCount");
      function update(){const target=Number(form.density.value)||54;const selected=[...grid.querySelectorAll(".tcell:not(.h-empty)")].length;count.textContent=`${selected}/${target} plotted on acre 1`;}
      grid.querySelectorAll(".tcell").forEach(b=>b.addEventListener("click",()=>{b.classList.toggle("h-empty");b.classList.toggle("h-ok");b.textContent=b.classList.contains("h-empty")?"":[...grid.querySelectorAll(".tcell:not(.h-empty)")].indexOf(b)+1;state.newFarmPreview=null;update()}));
      form.density.addEventListener("input",update);
      form.addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(form), target=Number(fd.get("density")), selected=[...grid.querySelectorAll(".tcell:not(.h-empty)")];if(target<50||target>57||selected.length!==target){document.getElementById("previewPane").innerHTML=`<h3 class="cardt">Preview blocked</h3><p class="sub">Grid count must match the tree count. Current count is ${selected.length}/${target} plotted.</p>`;return;}const id="FRM-AP-PREV-0001";document.getElementById("previewPane").innerHTML=`<h3 class="cardt">Preview only - not saved yet</h3><p class="sub">${fd.get("name")} · ${fd.get("village")}, ${fd.get("mandal")}, ${fd.get("district")} · ${fd.get("acres")} acre · ${selected.length} preview trees</p><div class="treegrid">${Array.from({length:64},(_,i)=>{const on=!grid.children[i].classList.contains("h-empty");const seq=on?selected.indexOf(grid.children[i])+1:0;return `<button class="tcell ${on?"h-ok":"h-empty"}" ${on?`title="${id}-T${String(seq).padStart(3,"0")}"`:"disabled title='No tree'"}>${on?seq:""}</button>`}).join("")}</div><p class="sub">Occupied preview cells are Pending / no evidence yet. This preview did not create records.</p><button class="btn-ghost" id="editAgain">Edit grid</button>`;document.getElementById("editAgain").addEventListener("click",()=>form.scrollIntoView({behavior:"smooth",block:"start"}));});
    }
    render();
  </script>
